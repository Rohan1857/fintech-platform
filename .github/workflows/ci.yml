name: CI / Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Check Code Formatting (gofmt)
        run: |
          diff -u <(echo -n) <(gofmt -d -s .)

      - name: Go Vet
        run: go vet ./...

      - name: Run Unit & Concurrency Tests (with Race Detector)
        env:
          GOSUMDB: off
        run: |
          go test -race -v -timeout 5m ./...

      - name: Build Binaries Verification
        env:
          GOSUMDB: off
        run: |
          go build -v -o /dev/null ./cmd/server
          go build -v -o /dev/null ./cmd/loadtest

      - name: Run Reproducible Benchmark Suite
        env:
          GOSUMDB: off
        run: |
          go run ./cmd/loadtest/main.go
